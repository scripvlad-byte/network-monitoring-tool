<!DOCTYPE html>
<html>
<head>
    <title>Network Monitoring Tool</title>
</head>
<body>
    <h1>Network Monitoring Dashboard</h1>

    <table border="1">
        <tr>
            <th>Device</th>
            <th>IP</th>
            <th>Status</th>
        </tr>

        {% for device in devices %}
        <tr>
            <td>{{ device.name }}</td>
            <td>{{ device.ip }}</td>
            <td>{{ device.status }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
